<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanical Counter</title>
<style>
:root{--bg:#f4f1ea;--fg:#222;--dim:#888;--panel:#fff;--gear:#b08d57;--gear2:#8a6d3b;--hl:#ffe066;--ok:#2f9e44;--no:#c92a2a;--line:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#eee;--dim:#888;--panel:#262522;--gear:#b08d57;--gear2:#d9b26f;--hl:#5c4a00;--ok:#51cf66;--no:#ff6b6b;--line:#3a3935}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Malgun Gothic",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 320px;gap:16px}
@media (max-width:800px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
svg{width:100%;height:auto;display:block}
#crank{cursor:grab;touch-action:none}
#crank:active{cursor:grabbing}
svg text{font-family:ui-monospace,Consolas,monospace;fill:var(--fg)}
pre{margin:0;font:15px/1.7 ui-monospace,Consolas,monospace}
pre span{display:block;padding:0 6px;border-radius:4px;transition:background .15s}
pre span.active{background:var(--hl)}
pre span.true::after{content:"  ← True";color:var(--ok);font-weight:bold}
pre span.false::after{content:"  ← False";color:var(--no)}
.state{font:18px/1.6 ui-monospace,Consolas,monospace}
.state b{display:inline-block;min-width:3ch}
#banner{color:var(--no);font-weight:bold;min-height:1.4em}
.buttons{grid-column:1/-1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font-size:16px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--hl)}
table{border-collapse:collapse;width:100%;font-size:14px}
td{border-top:1px solid var(--line);padding:4px}
h3{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:normal}
</style>
</head>
<body>
<main>
  <div class="panel">
    <svg id="svg" viewBox="0 0 620 400">
      <text x="160" y="28" text-anchor="middle" font-size="14" style="fill:var(--dim)">10의 자리</text>
      <text x="420" y="28" text-anchor="middle" font-size="14" style="fill:var(--dim)">1의 자리</text>
      <!-- 현재 값 포인터 -->
      <polygon points="150,52 170,52 160,68" fill="var(--no)"/>
      <polygon points="410,52 430,52 420,68" fill="var(--no)"/>
      <g id="tensGear"><title>⚙ 10의 자리 기어 — 레지스터 tens</title></g>
      <g id="onesGear"><title>⚙ 1의 자리 기어 — 레지스터 ones. 빨간 핀이 9→0 순간 레버를 친다</title></g>
      <g id="lever">
        <title>carry 레버 — if 문. 핀에 맞을 때만 움직인다</title>
        <rect x="225" y="184" width="150" height="12" rx="6" fill="var(--no)" opacity=".85"/>
        <circle cx="300" cy="190" r="7" fill="var(--fg)"/>
      </g>
      <g id="crank">
        <title>크랭크 — 클럭. 1회전 = 명령 1회 실행. 시계방향으로 드래그</title>
        <circle cx="565" cy="335" r="45" fill="transparent"/>
        <circle cx="565" cy="335" r="30" fill="none" stroke="var(--gear2)" stroke-width="3"/>
        <line x1="565" y1="335" x2="565" y2="305" stroke="var(--gear2)" stroke-width="6" stroke-linecap="round"/>
        <circle cx="565" cy="305" r="10" fill="var(--gear2)"/>
      </g>
      <circle cx="565" cy="335" r="5" fill="var(--fg)" pointer-events="none"/>
      <text x="565" y="392" text-anchor="middle" font-size="13" style="fill:var(--dim)">드래그해서 돌리기 ↻</text>
      <text id="bigTens" x="160" y="365" text-anchor="middle" font-size="40">0</text>
      <text id="bigOnes" x="420" y="365" text-anchor="middle" font-size="40">0</text>
    </svg>
  </div>

  <div style="display:grid;gap:16px;align-content:start">
    <div class="panel state">
      <h3>현재 상태</h3>
      tens = <b id="sTens">0</b><br>
      ones = <b id="sOnes">0</b><br>
      RUN #<b id="sRun">0</b>
      <div id="banner"></div>
    </div>
    <div class="panel">
      <h3>크랭크 1회 = 이 함수 1회</h3>
<pre><span id="l-def">def crank():</span><span id="l-inc">    ones += 1</span><span id="l-if">    if ones == 10:</span><span id="l-reset">        ones = 0</span><span id="l-tens">        tens += 1</span><span id="l-ovf">        if tens == 10: tens = 0</span></pre>
    </div>
    <div class="panel">
      <h3>기계 ↔ 논리</h3>
      <table>
        <tr><td>크랭크 1회전</td><td>클럭 1틱</td></tr>
        <tr><td>기어 각도</td><td>변수(레지스터) 값</td></tr>
        <tr><td>핀이 레버에 닿음</td><td><code>if</code> 조건 True</td></tr>
        <tr><td>레버가 옆 기어를 밂</td><td>carry, <code>tens += 1</code></td></tr>
      </table>
    </div>
  </div>

  <div class="buttons">
    <button id="bPrev">◀ 이전</button>
    <button id="bCrank">크랭크 1회 돌리기</button>
    <button id="bAuto">자동</button>
  </div>
</main>

<script>
const STEP = 36;                       // 10개 숫자 → 한 칸 36°
const T = {cx:160, cy:190}, O = {cx:420, cy:190}, C = {cx:565, cy:335}, L = {cx:300, cy:190};
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);

// 순수 논리: 화면과 무관. 아래 self-check가 이걸 검증한다.
function next(ones, tens) {
  ones += 1;
  if (ones === 10) {
    ones = 0; tens += 1;
    const overflow = tens === 10;
    if (overflow) tens = 0;
    return {ones, tens, carry: true, overflow};
  }
  return {ones, tens, carry: false, overflow: false};
}
(function selfCheck() {
  let o = 0, t = 0;
  for (let i = 1; i <= 250; i++) {
    ({ones: o, tens: t} = next(o, t));
    console.assert(o + 10 * t === i % 100, 'counter wrong at', i);
  }
})();

// --- 기어 그리기 ---
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
}
function polar(c, r, deg) { const a = (deg - 90) * Math.PI / 180; return [c.cx + r * Math.cos(a), c.cy + r * Math.sin(a)]; }
function buildGear(g, c, withPin) {
  const n = 40, pts = [];               // 20개 이빨 = 40개 구간
  for (let i = 0; i < n; i++) {
    const r = i % 2 ? 100 : 110;
    pts.push(polar(c, r, i * 360 / n), polar(c, r, (i + 1) * 360 / n));
  }
  el('polygon', {points: pts.map(p => p.join(',')).join(' '), fill: 'var(--gear)', stroke: 'var(--gear2)', 'stroke-width': 2}, g);
  el('circle', {cx: c.cx, cy: c.cy, r: 12, fill: 'var(--gear2)'}, g);
  for (let k = 0; k < 10; k++) {
    const [x, y] = polar(c, 82, k * STEP);
    el('text', {x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 18,
      transform: `rotate(${k * STEP} ${x} ${y})`}, g).textContent = k;
  }
  if (withPin) {
    // 9→0 전환의 정중앙에 이 핀이 정확히 왼쪽(레버 끝, 각도 270°)을 지난다
    const [x, y] = polar(c, 60, 252);
    el('circle', {cx: x, cy: y, r: 7, fill: 'var(--no)'}, g);
  } else {
    // 레버가 밀어 올리는 페그 10개
    for (let k = 0; k < 10; k++) {
      const [x, y] = polar(c, 60, 18 + k * STEP);
      el('circle', {cx: x, cy: y, r: 4, fill: 'var(--gear2)'}, g);
    }
  }
}
buildGear($('tensGear'), T, false);
buildGear($('onesGear'), O, true);

// --- 상태 ---
// S = 확정된 상태. 각도는 누적값이라 9→0에서 되감지 않고 같은 방향으로 계속 돈다.
const START = 8;
const S = {ones: START, tens: 0, run: 0, oa: -STEP * START, ta: 0, ca: 0};
// cur = 진행 중인 한 스텝. f = 크랭크 진행률 0..1. 버튼도 마우스도 f만 움직인다.
let cur = null;
const hist = [];
let busy = false, auto = false;

const rot = (id, a, c) => $(id).setAttribute('transform', `rotate(${a} ${c.cx} ${c.cy})`);
function begin() { if (!cur) { cur = {n: next(S.ones, S.tens), f: 0}; banner(''); } }

// f 하나에서 기계 자세와 코드 강조를 전부 계산한다.
function render() {
  const f = cur ? cur.f : 0, n = cur && cur.n;
  // carry 스텝은 후반부(f .5→1)에 핀이 레버를 밀고, 레버가 tens를 한 칸 민다
  const g = n && n.carry ? Math.min(1, Math.max(0, (f - .5) * 2)) : 0;
  rot('crank', S.ca + 360 * f, C);
  rot('onesGear', S.oa - STEP * f, O);
  rot('tensGear', S.ta - STEP * g, T);
  rot('lever', 20 * Math.sin(g * Math.PI), L);

  let ones = S.ones;
  if (cur) {
    if (!n.carry) {
      if (f < .9) hl('l-inc'); else { hl('l-if', 'false'); ones = n.ones; }
    } else if (f < .5) hl('l-inc');
    else if (g < .2) { hl('l-if', 'true'); ones = '10'; banner('CARRY — 핀이 레버를 쳤다'); }
    else if (g < .5) { hl('l-reset'); ones = 0; }
    else { hl('l-tens'); ones = 0; }
  }
  $('sOnes').textContent = $('bigOnes').textContent = ones;
  $('sTens').textContent = $('bigTens').textContent = S.tens;
  $('sRun').textContent = S.run;
}
function commit() {
  const n = cur.n;
  hist.push({...S});
  S.oa -= STEP; S.ca += 360; if (n.carry) S.ta -= STEP;
  S.ones = n.ones; S.tens = n.tens; S.run++;
  cur = null;
  if (n.overflow) { hl('l-ovf', 'true'); banner('OVERFLOW — 99 다음은 00. 3번째 기어가 없다'); }
  render();
}
function hl(id, cls) {
  document.querySelectorAll('pre span').forEach(s => s.className = '');
  if (id) $(id).className = 'active' + (cls ? ' ' + cls : '');
}
const banner = t => $('banner').textContent = t;
const wait = ms => new Promise(r => setTimeout(r, ms));
const ease = x => x < .5 ? 2 * x * x : 1 - (-2 * x + 2) ** 2 / 2;
function tween(ms, fn) {
  return new Promise(done => {
    const t0 = performance.now();
    (function f(now) {
      const p = Math.min(1, (now - t0) / ms);
      fn(ease(p)); render();
      p < 1 ? requestAnimationFrame(f) : done();
    })(t0);
  });
}
function lock(v) { busy = v; $('bPrev').disabled = v || (!hist.length && !cur); $('bCrank').disabled = v; }

// 버튼 = f를 자동으로 0→1 재생. 마우스로 반쯤 돌려둔 상태에서 눌러도 거기서 이어간다.
async function crank() {
  if (busy) return;
  lock(true); begin();
  const go = (to, ms) => { const from = cur.f; return tween(Math.max(1, ms * (to - from)), p => { cur.f = from + (to - from) * p; }); };
  if (!cur.n.carry) await go(1, 450);
  else {
    // 슬로모션: 핀이 레버에 닿는 순간(f=.5)에서 멈춰 if를 보여준다
    if (cur.f < .5) { await go(.5, 1800); await wait(900); }
    await go(1, 2400);
  }
  const overflow = cur.n.overflow;
  commit();
  await wait(overflow ? 900 : 250);
  lock(false);
}

function prev() {
  if (busy) return;
  if (cur) cur = null;                       // 돌리다 만 스텝은 버린다
  else if (hist.length) Object.assign(S, hist.pop());
  render(); hl(); banner('');
  lock(false);
}

// --- 마우스로 크랭크 돌리기 ---
const svg = $('svg'), crankEl = $('crank');
let drag = null;
function pointerAngle(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return Math.atan2(q.y - C.cy, q.x - C.cx) * 180 / Math.PI;
}
crankEl.addEventListener('pointerdown', e => {
  if (busy) return;
  e.preventDefault();
  crankEl.setPointerCapture(e.pointerId);
  drag = {a: pointerAngle(e)};
  lock(true); begin();
});
crankEl.addEventListener('pointermove', e => {
  if (!drag) return;
  const a = pointerAngle(e);
  const d = ((a - drag.a + 540) % 360) - 180;   // -180..180, 경계 넘어도 연속
  drag.a = a;
  // 래칫: 스텝 시작점(f=0) 밑으로는 역회전 불가. 되돌리기는 ◀ 이전으로.
  cur.f = Math.max(0, cur.f + d / 360);
  while (cur.f >= 1) { const rest = cur.f - 1; commit(); begin(); cur.f = rest; }
  render();
});
function endDrag() {
  if (!drag) return;
  drag = null;
  if (cur && cur.f === 0) cur = null;
  lock(false);
}
crankEl.addEventListener('pointerup', endDrag);
crankEl.addEventListener('pointercancel', endDrag);

async function autoLoop() {
  while (auto) { await crank(); await wait(200); }
}
$('bCrank').onclick = crank;
$('bPrev').onclick = prev;
$('bAuto').onclick = () => {
  auto = !auto; $('bAuto').classList.toggle('on', auto);
  if (auto) autoLoop();
};
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); crank(); }
  if (e.key === 'ArrowLeft') prev();
});

render(); lock(false);
</script>
</body>
</html>
